# ── Excluded vulnerability categories ──────────────────────────
excluded_vulnerabilities:
  - category: missing_security_headers
    reason: Informational only
    detail: "Missing headers (CSP, X-Frame-Options, etc.) without demonstrated impact"

  - category: rate_limiting
    reason: Not a vulnerability on its own
    detail: "Lack of rate limiting without demonstrated abuse scenario"

  - category: self_xss
    reason: Not impactful
    detail: "Self-XSS requires social engineering"

  - category: spf_dmarc
    reason: Email config issues excluded
    detail: "SPF/DKIM/DMARC misconfigurations"

  - category: best_practices
    reason: Informational
    detail: "General best practice recommendations without demonstrable impact"

# ── Bounty tiers ───────────────────────────────────────────────
# Base payouts + 25% promo bonus for Critical & High during campaign
bounty:
  - severity: critical
    min: 18000
    max: 25000
    notes: "+25% promo bonus = $22,500-$31,250 effective"
  - severity: high
    min: 5000
    max: 15000
    notes: "+25% promo bonus = $6,250-$18,750 effective"
  - severity: medium
    min: 1500
    max: 5000
    notes: "AI feature medium: $2,500 + 25% bonus = $3,125"
  - severity: low
    min: 500
    max: 1500

# ── Testing rules ──────────────────────────────────────────────
testing:
  max_requests_per_second: 5
  no_automated_scanners: false
  no_destructive_testing: true
  required_headers:
    X-Bug-Bounty: vapt-cli-testing
  rate_profile: polite
  modules:
    - web
    - api
    - ssl
    - jsscan
    - cve
    - recon
    - domscan

